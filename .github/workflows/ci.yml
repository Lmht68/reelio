name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate workflow permissions
        run: uvx --from zizmor==1.30.0 zizmor --pedantic .github/workflows

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run complete pytest suite
        run: uv run --locked pytest

      - name: Check Ruff linting
        run: uv run --locked ruff check .

      - name: Check Ruff formatting
        run: uv run --locked ruff format --check .

      - name: Check strict mypy
        run: uv run --locked mypy src tests

      - name: Build production Docker image
        run: docker build --pull --tag reelio:ci .
