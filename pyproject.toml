[project]
name = "Reelio"
version = "0.1.0"
description = "Reelio extracts and enriches movies, music, books, and creators mentioned in social media content."
readme = "README.md"
authors = [
    { name = "Thinh" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp[curl-cffi,default]>=2026.7.4",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
