[project]
name = "Reelio"
version = "0.1.0"
description = "Reelio extracts and enriches movies, music, books, and creators mentioned in social media content."
readme = "README.md"
authors = [
    { name = "Thinh" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "faster-whisper>=1.2.1",
    "openai>=3.1.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
reelio = "reelio:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
