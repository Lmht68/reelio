[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Reelio"
version = "0.1.0"
description = "Reelio extracts and enriches movies, music, books, and creators mentioned in social media content."
readme = "README.md"
authors = [
    { name = "Thinh" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "cachetools>=7.1.6",
    "fastapi[standard]>=0.139.2",
    "faster-whisper>=1.2.1",
    "openai>=2.50.0",
    "pydantic-settings>=2.14.2",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp[default]>=2026.7.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/reelio"]
